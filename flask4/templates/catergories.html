{% extends "base.html" %}

{% block title %}Управление категориями{% endblock %}

{% block content %}
<div class="row">
    <div class="col-md-6 mx-auto">
        <div class="card">
            <div class="card-header bg-primary text-white">
                <h4 class="mb-0"><i class="fas fa-folder"></i> Управление категориями</h4>
            </div>
            <div class="card-body">
                <form method="POST" action="{{ url_for('create_category') }}" class="mb-4">
                    <div class="input-group">
                        <input type="text" name="name" class="form-control" placeholder="Название категории" required>
                        <button type="submit" class="btn btn-success">
                            <i class="fas fa-plus"></i> Добавить
                        </button>
                    </div>
                </form>
                
                <hr>
                
                <h5>Существующие категории:</h5>
                <div class="list-group">
                    {% for category in categories %}
                        <div class="list-group-item d-flex justify-content-between align-items-center">
                            {{ category.name }}
                            <span class="badge bg-secondary">Постов: {{ category.posts|length }}</span>
                            <a href="{{ url_for('delete_category', category_id=category.id) }}" 
                               class="btn btn-danger btn-sm"
                               onclick="return confirm('Удалить категорию? Все посты в ней останутся без категории.')">
                                <i class="fas fa-trash"></i>
                            </a>
                        </div>
                    {% else %}
                        <div class="alert alert-info">Нет категорий</div>
                    {% endfor %}
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
