{% extends "base.html" %}

{% block title %}Управление тегами{% endblock %}

{% block content %}
<div class="row">
    <div class="col-md-6 mx-auto">
        <div class="card">
            <div class="card-header bg-info text-white">
                <h4 class="mb-0"><i class="fas fa-tags"></i> Управление тегами</h4>
            </div>
            <div class="card-body">
                <form method="POST" action="{{ url_for('admin.create_tag') }}" class="mb-4">
                    <div class="input-group">
                        <input type="text" name="name" class="form-control" placeholder="Название тега" required>
                        <button type="submit" class="btn btn-success">
                            <i class="fas fa-plus"></i> Добавить
                        </button>
                    </div>
                </form>

                <hr>

                <h5>Существующие теги:</h5>
                {% if tags %}
                    <div class="list-group">
                        {% for tag in tags %}
                            <div class="list-group-item d-flex justify-content-between align-items-center">
                                <span>
                                    <i class="fas fa-tag"></i> {{ tag.name }}
                                </span>
                                <div class="d-flex align-items-center gap-3">
                                    <span class="badge bg-secondary rounded-pill">
                                        Постов: {{ tag.post_count }}
                                    </span>
                                    <a href="{{ url_for('admin.delete_tag', tag_id=tag.id) }}"
                                       class="btn btn-danger btn-sm"
                                       onclick="return confirm('Удалить тег "{{ tag.name }}"?')">
                                        <i class="fas fa-trash"></i> Удалить
                                    </a>
                                </div>
                            </div>
                        {% endfor %}
                    </div>
                {% else %}
                    <div class="alert alert-info">Нет тегов</div>
                {% endif %}
            </div>
        </div>
    </div>
</div>
{% endblock %}
