{% extends "base.html" %}

{% block title %}Управление тегами{% endblock %}

{% block content %}
<div class="row">
    <div class="col-md-6 mx-auto">
        <div class="card">
            <div class="card-header bg-info text-white">
                <h4 class="mb-0"><i class="fas fa-tags"></i> Управление тегами</h4>
            </div>
            <div class="card-body">
                <form method="POST" action="{{ url_for('create_tag') }}" class="mb-4">
                    <div class="input-group">
                        <input type="text" name="name" class="form-control" placeholder="Название тега" required>
                        <button type="submit" class="btn btn-success">
                            <i class="fas fa-plus"></i> Добавить
                        </button>
                    </div>
                </form>
                
                <hr>
                
                <h5>Существующие теги:</h5>
                <div class="list-group">
                    {% for tag in tags %}
                        <div class="list-group-item d-flex justify-content-between align-items-center">
                            {{ tag.name }}
                            <span class="badge bg-secondary">Постов: {{ tag.posts.count() }}</span>
                            <a href="{{ url_for('delete_tag', tag_id=tag.id) }}" 
                               class="btn btn-danger btn-sm"
                               onclick="return confirm('Удалить тег?')">
                                <i class="fas fa-trash"></i>
                            </a>
                        </div>
                    {% else %}
                        <div class="alert alert-info">Нет тегов</div>
                    {% endfor %}
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
